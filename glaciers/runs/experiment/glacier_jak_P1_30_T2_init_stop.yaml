# @package _global_
# glacier_jak (Jakobshavn Isbrae); data/glacier_jak/start_150m.nc: 667 x 401 cells at 150 m, 260,457 domain ice cells (480 floating) + 30 quasi-rigid band cells, observed speed up to 14672 m/yr.
# Domain: box x -195.5..-95.5, y -2305..-2245 km (EPSG:3413; igm-jakobshavn's box enlarged), all ice kept, free edges.
# Method: scenario P1_30, online network (prep/methods/hybrid.yaml), schedule T2 of
# studies/jak_adaptive_nbit: 20 training iterations per retrain until 1 yr, then 1, retraining
# every 2nd step (igm's native nbit schedule; the 30-yr run j30_T2 used the adaptive_nbit user process).
# Weertman sliding with the tau_ref field of the input: velocity-calibrated (igm time_relaxation, outputs/glacier_jak_calib: 110 updates, alpha 0.5, eps 5 m/yr, r_max 0.5, cold Newton-CG solves), prior tau_ref_sia = SIA local balance
# (sliding.tau_ref is only the fallback),
# prep/forcing/glacier_jak.yaml scenario P1_30.
# With init_stop: the initial training (at most 4000 iterations) stops once its error against a
# direct solve of the initial state is <= 1 % grounded and <= 2.5 % floating (or after 500
# iterations without gain); the direct solve uses the cg_newton block below (as prep/methods/exact.yaml).
# Written by hand (2026-09-30) from glacier_jak_P1_30_T2.yaml (itself from the GENERATED
# glacier_jak_P1_30_hybrid.yaml): nbit_init 4000, init_stop and cg_newton differ. Run from igm-marine/:
#   igm_run +experiment=glacier_jak_P1_30_T2_init_stop
#   (or ./run_igm.sh $(./pick_gpu.sh) igm-32 NAME glacier_jak_P1_30_T2_init_stop)
defaults:
- /user/conf/processes@processes: [iceflow_geometry, save_times, thin_ice]
- /user/conf/outputs@outputs: marine_ts
- override /inputs: [local]
- override /processes: [iceflow_geometry, ocean, iceflow, calving_rate, bmb, time, save_times, thk, thin_ice]
- override /outputs: [write_ncdf, marine_ts]
core:
  print_comp: false
inputs:
  local:
    filename: glacier_jak/start_150m.nc
processes:
  time:
    cfl: 0.3
    cfl_percentile: 100.0
    step_max: 0.1
    start: 0.0
    end: 30.0
    save: 1.0
  iceflow:
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 917.0
      water_density: 1023.0
      cf_eswn: []
      viscosity:
        arrhenius: 33.1
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.0738739
        u_ref: 100.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      normalization:
        method: fixed
        fixed:
          inputs_offsets:
            thk: 0.0
            usurf: 1125.64
            arrhenius: 33.1
            tau_ref: 0.137677
            dX: 150.0
            water_level: 0.0
          inputs_variances:
            thk: 1506410.0
            usurf: 132219.0
            arrhenius: 1095.61
            tau_ref: 0.0438559
            dX: 1.0
            water_level: 1576320.0
      mapping: network
      network:
        pretrained: false
        seed: 0
        architecture: hybrid_dahunet_fno
        params:
          nb_out_filter: 16
          nb_layers: 12
          conv_ker_size: 3
          residual: true
          width: 32
          modes1: 8
          modes2: 8
          fno_layers: 2
      optimizer: ss_esoap
      ss_esoap:
        lr_init: 0.0003
        lr: 0.0003
      nbit_init: 4000
      nbit_warmup: -1
      nbit: [[0.0, 20], [1.0, 1]]
      retrain_freq: 2
      display:
        print_cost: false
      init_stop:
        enabled: true
        target_grounded: 1.0
        target_floating: 2.5
        patience: 500
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_max_iter: 4000
        warm_start: false
  thk:
    scheme: explicit
    ratio_density: 0.8963831867057673
    front:
      method: sub_grid
      first_order: true
      threshold: flux
      fixed: false
      min_thickness: 0.0
    boundary:
      left: dirichlet
      right: dirichlet
      top: dirichlet
      bottom: dirichlet
    remove_rigid_body_modes: true
  ocean:
    method: profile
    profile:
      array: [[z, temp, salinity], [0.0, 0.5, 33.0], [-150.0, 0.5, 33.8], [-300.0, 2.0, 34.3], [-1200.0,
          2.0, 34.5]]
    anomaly_array: [[time, delta_temp], [0.0, 0.0], [30.0, 2.0]]
  bmb:
    method: quadratic
    update_freq: 0.0
    include_grounded_melt: false
    grounding_line:
      treatment: nmp
    quadratic:
      averaging: local
      delta_T: 0.0
      water_equivalent: true
      gamma0: 65317.1
  calving_rate:
    law: ice_speed
    von_mises:
      sigma_max_grounded: 1.0
      sigma_max_floating: 0.5
    frontal_melt:
      method: none
      field: frontal_melt_forcing
    ice_speed:
      factor: 1.0
      front_velocity: -500.0
outputs:
  write_ncdf:
    vars_to_save: [topg, usurf, lsurf, thk, Href, ice_area_fraction, iceflow_input_thk, iceflow_input_usurf,
      smb, bmb, water_level, velbar_mag, velsurf_mag, velbase_mag, uvelsurf, vvelsurf, calving_rate, frontal_melt_rate,
      calved_thk, ocean_thermal_forcing]
    complevel: 1
  marine_ts:
    freq: 0.05
    flowline: data/glacier_jak/flowline.csv
