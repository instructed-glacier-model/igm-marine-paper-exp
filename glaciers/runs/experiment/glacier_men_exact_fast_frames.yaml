# @package _global_
# Written by hand (2026-10-01) from the GENERATED experiment/glacier_men_exact_fast.yaml: the same
# exact fast Newton-CG run with the user process save_times (frames at 0.01, 0.05, 0.1, 0.25 and
# 0.5 yr, then every year), the frames of the network runs of studies/men_nbit_mt5_25yr, so that the errors
# against the exact run cover the first year.
# glacier_men (Mendenhall Glacier); data/glacier_men/start_50m.nc: 354 x 409 cells at 50 m, 43,626 domain ice cells (40 floating) + 121 quasi-rigid band cells, observed speed up to 163 m/yr.
# Domain: RGI 6 outline RGI60-01.00709 (trimmed by the DEM lake); neighbouring icefield ice is part of the DEM surface = bed (rock walls).
# Method: forced run, exact fast Newton-CG (1 m/yr, consecutive 3) (prep/methods/exact + exact_fast.yaml).
# Weertman sliding with the tau_ref field of the input: velocity-calibrated (igm time_relaxation, outputs/glacier_men_calib: 110 updates, alpha 0.5, eps 5 m/yr, r_max 0.5, cold Newton-CG solves), prior tau_ref_sia = SIA local balance
# (sliding.tau_ref is only the fallback),
# prep/forcing/glacier_men.yaml scenario forced.
# (Original note:) GENERATED by prep/make_experiments.py glacier_men: edit prep/methods/ or the
# generator and rerun it, not this file.
defaults:
- /user/conf/processes@processes: [iceflow_geometry, save_times]
- /user/conf/outputs@outputs: marine_ts
- override /inputs: [local]
- override /processes: [iceflow_geometry, smb, iceflow, calving_rate, time, save_times, thk]
- override /outputs: [write_ncdf, marine_ts]
core:
  print_comp: false
inputs:
  local:
    filename: glacier_men/start_50m.nc
processes:
  time:
    cfl: 0.3
    cfl_percentile: 100.0
    step_max: 0.1
    start: 0.0
    end: 30.0
    save: 2.5
  iceflow:
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 917.0
      water_density: 1000.0
      cf_eswn: []
      viscosity:
        arrhenius: 75.7
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 1.8035
        u_ref: 100.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 200
      nbit: 20
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 0.01
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 1.0
        print_timing: true
      halt:
        freq: 1
        raise_on_failure: true
        success:
        - criterion: abs_change
          metric: u
          abs_change:
            tol: 1.0
            reduction: rmse
            consecutive: 3
        failure:
        - criterion: nan
          metric: u
        - criterion: inf
          metric: u
      display:
        print_cost: false
  thk:
    scheme: explicit
    ratio_density: 0.917
    front:
      method: sub_grid
      first_order: true
      threshold: flux
      fixed: false
      min_thickness: 0.0
    boundary:
      left: zero
      right: zero
      top: zero
      bottom: zero
    remove_rigid_body_modes: true
  smb:
    method: simple
    simple:
      update_freq: 1.0
      array: [[time, gradabl, gradacc, ela, accmax], [0.0, 0.009, 0.005, 1235.66, 2.0], [30.0, 0.009,
          0.005, 1415.66, 2.0]]
  calving_rate:
    law: water_depth
    water_depth:
      k: 2.0
outputs:
  write_ncdf:
    vars_to_save: [topg, usurf, lsurf, thk, Href, ice_area_fraction, iceflow_input_thk, iceflow_input_usurf,
      smb, bmb, water_level, velbar_mag, velsurf_mag, velbase_mag, uvelsurf, vvelsurf, calving_rate, frontal_melt_rate,
      calved_thk, ocean_thermal_forcing]
    complevel: 1
  marine_ts:
    freq: 0.25
    flowline: data/glacier_men/flowline.csv
