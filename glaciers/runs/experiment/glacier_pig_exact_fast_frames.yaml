# @package _global_
# Written by hand (2026-10-01) from the GENERATED experiment/glacier_pig_exact_fast.yaml: the same
# exact fast Newton-CG run with the user process save_times (frames at 0.01, 0.05, 0.1, 0.25 and
# 0.5 yr, then every year), the frames of the network runs of studies/pig_emulator
# (nbit_after1_100yr.yaml), so that the errors against the exact run cover the first year.
# glacier_pig (Pine Island Glacier); data/glacier_pig/start_1km.nc: 469 x 564 cells at 1000 m, 142,091 domain ice cells (6,537 floating) + 5,299 quasi-rigid band cells, observed speed up to 5209 m/yr.
# Domain: De Rydt et al. (2021, TC 15, 113) model domain: 135,000 km2 grounded catchment (Rignot et al., 2011) + floating extension; outline of their Ua mesh (OSF doi:10.17605/OSF.IO/TEKRF, optim_1996_gaA1_gaC1_gsA25000_gsC25000_m3.nc, alpha 8 km).
# Method: forced run, exact fast Newton-CG (1 m/yr, consecutive 3) (prep/methods/exact + exact_fast.yaml).
# Weertman sliding with the tau_ref field of the input: velocity-calibrated (igm time_relaxation, outputs/glacier_pig_calib: 110 updates, alpha 0.5, eps 5 m/yr, r_max 0.5, cold Newton-CG solves), prior tau_ref_sia = SIA local balance
# (sliding.tau_ref is only the fallback),
# prep/forcing/glacier_pig.yaml scenario forced.
# (Original note:) GENERATED by prep/make_experiments.py glacier_pig: edit prep/methods/ or the
# generator and rerun it, not this file.
defaults:
- /user/conf/processes@processes: [iceflow_geometry, save_times, tf_correction, flux_correction, thin_ice]
- /user/conf/outputs@outputs: marine_ts
- override /inputs: [local]
- override /processes: [iceflow_geometry, ocean, tf_correction, iceflow, bmb, flux_correction, time, save_times,
    thk, thin_ice]
- override /outputs: [write_ncdf, marine_ts]
core:
  print_comp: false
inputs:
  local:
    filename: glacier_pig/start_1km.nc
processes:
  time:
    cfl: 0.3
    cfl_percentile: 100.0
    step_max: 0.1
    start: 0.0
    end: 50.0
    save: 2.5
  iceflow:
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 917.0
      water_density: 1027.0
      cf_eswn: []
      viscosity:
        arrhenius: 11.0
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.110517
        u_ref: 100.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 200
      nbit: 20
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 0.01
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 1.0
        print_timing: true
      halt:
        freq: 1
        raise_on_failure: true
        success:
        - criterion: abs_change
          metric: u
          abs_change:
            tol: 1.0
            reduction: rmse
            consecutive: 3
        failure:
        - criterion: nan
          metric: u
        - criterion: inf
          metric: u
      display:
        print_cost: false
  thk:
    scheme: explicit
    ratio_density: 0.8928919182083739
    front:
      method: sub_grid
      first_order: true
      threshold: flux
      fixed: true
      min_thickness: 0.0
    boundary:
      left: zero
      right: zero
      top: zero
      bottom: zero
    remove_rigid_body_modes: true
  ocean:
    method: profile
    profile:
      array: [[z, temp, salinity], [0.0, -1.8, 33.8], [-300.0, -1.5, 34.0], [-700.0, 1.0, 34.65], [-1500.0,
          1.1, 34.72]]
    anomaly_array: [[time, delta_temp], [0.0, 0.0], [5.0, 1.0], [50.0, 1.0]]
  tf_correction:
    file: glacier_pig/tf_correction_obs_1km.nc
  flux_correction:
    file: glacier_pig/flux_correction_obs_1km.nc
  bmb:
    method: quadratic
    update_freq: 0.0
    include_grounded_melt: false
    allow_refreezing: true
    grounding_line:
      treatment: pmp
    quadratic:
      averaging: local
      gamma0: 49500.0
      delta_T: 0.0
      water_equivalent: true
outputs:
  write_ncdf:
    vars_to_save: [topg, usurf, lsurf, thk, Href, ice_area_fraction, iceflow_input_thk, iceflow_input_usurf,
      smb, bmb, water_level, velbar_mag, velsurf_mag, velbase_mag, uvelsurf, vvelsurf, calving_rate, frontal_melt_rate,
      calved_thk, ocean_thermal_forcing, ubar, vbar, divflux, shelf_melt_rate, grounded_fraction, tf_correction]
    complevel: 1
  marine_ts:
    freq: 0.25
    flowline: data/glacier_pig/flowline.csv
