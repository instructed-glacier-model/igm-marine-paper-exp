# @package _global_
# GENERATED by tools/make_replay_experiments.py from experiment/glacier_pig_snapshot.yaml: the
# snapshot numerics for every saved frame of a run, in one igm run (user process replay_geometry;
# set processes.replay_geometry.source, time.start / time.end and the input file of the first
# frame, see tools/replay_manifest.py).
defaults:
- /user/conf/processes@processes:
  - replay_geometry
  - iceflow_geometry
- override /inputs:
  - local
- override /processes:
  - replay_geometry
  - iceflow_geometry
  - iceflow
  - time
- override /outputs:
  - write_ncdf
core:
  print_comp: false
inputs:
  local:
    filename: glacier_pig/start_1km.nc
processes:
  iceflow:
    physics:
      energy_components:
      - viscosity
      - gravity
      - sliding
      - floating
      ice_density: 917.0
      water_density: 1027.0
      cf_eswn: []
      viscosity:
        arrhenius: 11.0
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.110517
        u_ref: 100.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      precision: double
    unified:
      inputs:
      - thk
      - usurf
      - arrhenius
      - tau_ref
      - dX
      - water_level
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 400
      nbit: 400
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 3
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 0.0001
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 0.0
        print_timing: false
      halt:
        freq: 1
        raise_on_failure: true
        success:
        - criterion: abs_change
          metric: u
          abs_change:
            tol: 0.1
            reduction: rmse
            consecutive: 3
        failure:
        - criterion: nan
          metric: u
        - criterion: inf
          metric: u
      display:
        print_cost: false
  time:
    cfl: 0.0
    cfl_percentile: 100.0
    step_max: 100.0
    start: 0.0
    end: 50.0
    save: 2.5
outputs:
  write_ncdf:
    vars_to_save:
    - topg
    - usurf
    - lsurf
    - thk
    - iceflow_input_thk
    - iceflow_input_usurf
    - velbar_mag
    - velsurf_mag
    - velbase_mag
    - uvelsurf
    - vvelsurf
    complevel: 1
