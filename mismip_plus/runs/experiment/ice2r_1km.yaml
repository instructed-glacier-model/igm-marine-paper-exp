# @package _global_
# MISMIP+ ice2r_1km: Ice2r, Ice2 melt from the Ice0 steady state.
# Input data/restart/ice0_1km.nc; t = 0 -> 100 yr.
# MOLHO (Nz 2, Q1, double), Weertman, A 25.25 MPa-3 yr-1 (8e-25 Pa-3 s-1), tau_ref 0.01 MPa at 1 m/yr; solver prep/methods/fast.yaml.
# GENERATED by prep/make_experiments.py: edit prep/ and rerun it, not this file.
hydra:
  run:
    dir: outputs/ice2r_1km
defaults:
- /user/conf/outputs@outputs: mismip_ts
- override /inputs: [local]
- override /processes: [time, smb, bmb, thk, thin_ice_calving, iceflow]
- override /outputs: [write_ncdf, mismip_ts]
core:
  print_info: false
  print_comp: true
inputs:
  local:
    filename: restart/ice0_1km.nc
processes:
  time:
    start: 0.0
    end: 100.0
    save: 10.0
    cfl: 0.3
    step_max: 1.0
  smb:
    method: simple
    simple:
      update_freq: 1000000000.0
      array:
      - [time, gradabl, gradacc, ela, accmax]
      - [0.0, 0.0, 1.0, -10000.0, 0.3]
      - [1000000.0, 0.0, 1.0, -10000.0, 0.3]
  thk:
    scheme: explicit
    ratio_density: 0.892996
    boundary:
      left: symmetric
      right: zero
      top: symmetric
      bottom: symmetric
  iceflow:
    method: unified
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 918.0
      water_density: 1028.0
      gravity_cst: 9.81
      cf_eswn: [E]
      viscosity:
        arrhenius: 25.2455
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.01
        u_ref: 1.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      precision: double
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      bcs: [dirichlet, periodic_ns]
      bc:
        dirichlet:
          left: 0.0
          right: null
          top: null
          bottom: null
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 200
      nbit: 20
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 0.01
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 1.0
        print_timing: false
      halt:
        freq: 1
        raise_on_failure: true
        success:
        - criterion: abs_change
          metric: u
          abs_change:
            tol: 1.0
            reduction: rmse
            consecutive: 3
        failure:
        - criterion: nan
          metric: u
        - criterion: inf
          metric: u
      display:
        print_cost: false
  thin_ice_calving:
    min_thk: 10.0
  bmb:
    method: prescribed
    update_freq: 0.0
    include_grounded_melt: false
    grounding_line:
      treatment: nmp
      sub_samples: 4
    prescribed:
      form: field
      field: prescribed_melt_rate
outputs:
  write_ncdf:
    output_file: output.nc
    complevel: 1
    vars_to_save: [topg, thk, usurf, lsurf, water_level, smb, ubar, vbar, velbar_mag, uvelsurf, vvelsurf, velsurf_mag,
      uvelbase, vvelbase, velbase_mag, bmb, shelf_melt_rate, grounded_fraction]
  mismip_ts:
    output_file: mismip_ts.csv
    freq: 1.0
