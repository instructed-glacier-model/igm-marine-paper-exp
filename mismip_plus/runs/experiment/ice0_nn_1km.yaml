# @package _global_
# MISMIP+ ice0_nn_1km: Ice0 spin-up stage 1, cheap hybrid emulator from a uniform 100-m slab
# (0.3 m/yr accumulation, no melt, CFL 0.8).
# Input data/mismip_plus_1km_slab100.nc; t = 0 -> 30000 yr.
# MOLHO (Nz 2, Q1, single), Weertman, A 25.25 MPa-3 yr-1 (8e-25 Pa-3 s-1), tau_ref 0.01 MPa at 1 m/yr; solver prep/methods/nn.yaml.
# GENERATED by prep/make_experiments.py: edit prep/ and rerun it, not this file.
hydra:
  run:
    dir: outputs/ice0_nn_1km
defaults:
- /user/conf/outputs@outputs: mismip_ts
- /user/conf/processes@processes: steady_stop
- override /inputs: [local]
- override /processes: [time, smb, thk, iceflow, steady_stop]
- override /outputs: [write_ncdf, mismip_ts]
core:
  print_info: false
  print_comp: true
inputs:
  local:
    filename: mismip_plus_1km_slab100.nc
processes:
  time:
    start: 0.0
    end: 30000.0
    save: 500.0
    cfl: 0.8
    step_max: 1.0
  smb:
    method: simple
    simple:
      update_freq: 1000000000.0
      array:
      - [time, gradabl, gradacc, ela, accmax]
      - [0.0, 0.0, 1.0, -10000.0, 0.3]
      - [1000000.0, 0.0, 1.0, -10000.0, 0.3]
  thk:
    scheme: explicit
    ratio_density: 0.892996
    boundary:
      left: symmetric
      right: zero
      top: symmetric
      bottom: symmetric
  iceflow:
    method: unified
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 918.0
      water_density: 1028.0
      gravity_cst: 9.81
      cf_eswn: [E]
      viscosity:
        arrhenius: 25.2455
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.01
        u_ref: 1.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      precision: single
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      bcs: [dirichlet, periodic_ns]
      bc:
        dirichlet:
          left: 0.0
          right: null
          top: null
          bottom: null
      mapping: network
      network:
        pretrained: false
        seed: 0
        architecture: hybrid_dahunet_fno
        params:
          nb_out_filter: 16
          nb_layers: 12
          conv_ker_size: 3
          residual: true
          width: 32
          modes1: 8
          modes2: 8
          fno_layers: 2
      optimizer: ss_esoap
      ss_esoap:
        lr_init: 0.0003
        lr: 0.001
      nbit_init: 200
      nbit: 2
      retrain_freq: 5
      normalization:
        method: fixed
        fixed:
          inputs_offsets:
            thk: 0.0
            usurf: 500.0
            arrhenius: 25.2455
            tau_ref: 0.01
            dX: 1000.0
            water_level: 0.0
          inputs_variances:
            thk: 1500000.0
            usurf: 400000.0
            arrhenius: 637.34
            tau_ref: 0.0001
            dX: 1000000.0
            water_level: 1.0
      display:
        print_cost: false
  steady_stop:
    check_freq: 10.0
    window: 1000.0
    min_years: 5000.0
    tol_gl: 500.0
    tol_vaf: 0.001
outputs:
  write_ncdf:
    output_file: output.nc
    complevel: 1
    vars_to_save: [topg, thk, usurf, lsurf, water_level, smb, ubar, vbar, velbar_mag, uvelsurf, vvelsurf, velsurf_mag,
      uvelbase, vvelbase, velbase_mag]
  mismip_ts:
    output_file: mismip_ts.csv
    freq: 10.0
