# @package _global_
# MISMIP+ ice2ra_1km_nn: Ice2ra, melt switched off at 100 yr (re-advance), hybrid emulator instead of cg_newton.
# Input data/restart/ice2r_1km_nn_t100.nc; t = 100 -> 200 yr.
# MOLHO (Nz 2, Q1, single), Weertman, A 25.25 MPa-3 yr-1 (8e-25 Pa-3 s-1), tau_ref 0.01 MPa at 1 m/yr; solver prep/methods/nn + nn_fwd.yaml.
# GENERATED by prep/make_experiments.py: edit prep/ and rerun it, not this file.
hydra:
  run:
    dir: outputs/ice2ra_1km_nn
defaults:
- /user/conf/outputs@outputs: mismip_ts
- override /inputs: [local]
- override /processes: [time, smb, thk, thin_ice_calving, iceflow]
- override /outputs: [write_ncdf, mismip_ts]
core:
  print_info: false
  print_comp: true
inputs:
  local:
    filename: restart/ice2r_1km_nn_t100.nc
processes:
  time:
    start: 100.0
    end: 200.0
    save: 10.0
    cfl: 0.3
    step_max: 1.0
  smb:
    method: simple
    simple:
      update_freq: 1000000000.0
      array:
      - [time, gradabl, gradacc, ela, accmax]
      - [0.0, 0.0, 1.0, -10000.0, 0.3]
      - [1000000.0, 0.0, 1.0, -10000.0, 0.3]
  thk:
    scheme: explicit
    ratio_density: 0.892996
    boundary:
      left: symmetric
      right: zero
      top: symmetric
      bottom: symmetric
  iceflow:
    method: unified
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 918.0
      water_density: 1028.0
      gravity_cst: 9.81
      cf_eswn: [E]
      viscosity:
        arrhenius: 25.2455
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.01
        u_ref: 1.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      precision: single
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      bcs: [dirichlet, periodic_ns]
      bc:
        dirichlet:
          left: 0.0
          right: null
          top: null
          bottom: null
      mapping: network
      network:
        pretrained: false
        seed: 0
        architecture: hybrid_dahunet_fno
        params:
          nb_out_filter: 16
          nb_layers: 12
          conv_ker_size: 3
          residual: true
          width: 32
          modes1: 8
          modes2: 8
          fno_layers: 2
      optimizer: ss_esoap
      ss_esoap:
        lr_init: 0.0003
        lr: 0.001
      nbit_init: 5000
      nbit: 10
      retrain_freq: 1
      normalization:
        method: fixed
        fixed:
          inputs_offsets:
            thk: 0.0
            usurf: 500.0
            arrhenius: 25.2455
            tau_ref: 0.01
            dX: 1000.0
            water_level: 0.0
          inputs_variances:
            thk: 1500000.0
            usurf: 400000.0
            arrhenius: 637.34
            tau_ref: 0.0001
            dX: 1000000.0
            water_level: 1.0
      display:
        print_cost: false
  thin_ice_calving:
    min_thk: 10.0
outputs:
  write_ncdf:
    output_file: output.nc
    complevel: 1
    vars_to_save: [topg, thk, usurf, lsurf, water_level, smb, ubar, vbar, velbar_mag, uvelsurf, vvelsurf, velsurf_mag,
      uvelbase, vvelbase, velbase_mag]
  mismip_ts:
    output_file: mismip_ts.csv
    freq: 1.0
