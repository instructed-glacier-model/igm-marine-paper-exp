# Transient velocity solve: identity mapping + Newton-CG, the igm-marine "exact, fast" block
# (copied from igm-marine/prep/methods/exact.yaml, 2026-09-26; there the igm-pablo /
# igm-jakobshavn reference block with barotropic multigrid, banded MOLHO Hessian and
# batched probes, yearly cold restart).
processes:
  iceflow:
    unified:
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 200
      nbit: 20
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 1.0e-2
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 1.0
        print_timing: false
      halt:
        freq: 1
        raise_on_failure: true
        success:
          - criterion: abs_change
            metric: u
            abs_change: {tol: 1.0, reduction: rmse, consecutive: 3}
        failure:
          - {criterion: nan, metric: u}
          - {criterion: inf, metric: u}
      display:
        print_cost: false
