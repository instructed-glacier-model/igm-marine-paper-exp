# @package _global_
# Albrecht et al. (2011) flowline, retreat_level_set_5km: front retreating at 300 m/yr (ice_speed) from the steady state, level_set front, 5km
# GENERATED by prep/make_experiments.py: edit prep/ and rerun it, not this file.
hydra:
  run:
    dir: outputs/retreat_level_set_5km
defaults:
- /user/conf/outputs@outputs: albrecht_ts
- override /inputs: [local]
- override /processes: [calving_rate, time, thk, iceflow]
- override /outputs: [write_ncdf, albrecht_ts]
core:
  print_info: false
  print_comp: true
inputs:
  local:
    filename: restart/adv_level_set_5km.nc
processes:
  time:
    start: 0.0
    end: 300.0
    save: 25.0
    cfl: 0.5
    step_max: 20.0
  thk:
    scheme: explicit
    slope_type: superbee
    ratio_density: 0.885214
    boundary:
      left: dirichlet
      right: zero
      top: symmetric
      bottom: symmetric
    front:
      method: level_set
      min_thickness: 0.0
  iceflow:
    method: unified
    physics:
      energy_components: [viscosity, gravity, sliding, floating]
      ice_density: 910.0
      water_density: 1028.0
      gravity_cst: 9.81
      cf_eswn: []
      viscosity:
        arrhenius: 4.600806
        exponent: 3.0
      sliding:
        law: weertman
        tau_ref: 0.01
        u_ref: 1.0
        exponent: 3.0
        regularization: 1.0
        use_mask_gr: true
    numerics:
      Nz: 2
      basis_vertical: molho
      basis_horizontal: q1
      precision: double
    unified:
      inputs: [thk, usurf, arrhenius, tau_ref, dX, water_level]
      bcs: [dirichlet, periodic_ns]
      bc:
        dirichlet:
          left: [300.0, 0.0]
          right: null
          top: null
          bottom: null
      mapping: identity
      optimizer: cg_newton
      line_search: armijo
      nbit_init: 200
      nbit: 20
      retrain_freq: 1
      cg_newton:
        preconditioner: barotropic_multigrid
        hvp_mode: banded
        probe_mode: autodiff
        probe_batch: 9
        hvp_verify: false
        operator_update_freq: 1
        damping: 1.0e-16
        damping_adaptive: true
        damping_min: 1.0e-26
        cg_tol: 0.01
        cg_max_iter: 4000
        warm_start: false
        cold_restart_interval: 1.0
        print_timing: false
      halt:
        freq: 1
        raise_on_failure: true
        success:
        - criterion: abs_change
          metric: u
          abs_change:
            tol: 1.0
            reduction: rmse
            consecutive: 3
        failure:
        - criterion: nan
          metric: u
        - criterion: inf
          metric: u
      display:
        print_cost: false
  calving_rate:
    law: ice_speed
    ice_speed:
      factor: 1.0
      front_velocity: -300.0
outputs:
  write_ncdf:
    output_file: output.nc
    complevel: 1
    vars_to_save: [topg, thk, usurf, lsurf, ubar, vbar, velbar_mag, Href, ice_area_fraction, calved_thk,
      psi, calving_rate, frontal_melt_rate]
  albrecht_ts:
    output_file: albrecht_ts.csv
    freq: 0.0
